<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Sơ đồ tư duy mẫu cho chương Phong trào yêu nước 1885–1896: bốn nhánh chính là bối cảnh, lãnh đạo, diễn biến chính, kết quả và ý nghĩa, mỗi nhánh có nhánh nhỏ ghi từ khóa ngắn">
  <rect width="800" height="450" fill="#fdf6ec"/>
  <text x="400" y="48" font-family="sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#333333">Sơ đồ tư duy mẫu</text>
  <ellipse cx="400" cy="200" rx="110" ry="45" fill="#d64545"/>
  <text x="400" y="196" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">Phong trào yêu nước</text>
  <text x="400" y="220" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">1885–1896</text>
  <g font-family="sans-serif" font-size="17" text-anchor="middle">
    <rect x="70" y="80" width="190" height="50" rx="10" fill="#4a90d9"/>
    <text x="165" y="111" fill="#ffffff" font-weight="bold">Bối cảnh</text>
    <rect x="540" y="80" width="190" height="50" rx="10" fill="#2e7d32"/>
    <text x="635" y="111" fill="#ffffff" font-weight="bold">Lãnh đạo</text>
    <rect x="70" y="300" width="190" height="50" rx="10" fill="#e67e22"/>
    <text x="165" y="331" fill="#ffffff" font-weight="bold">Diễn biến chính</text>
    <rect x="540" y="300" width="190" height="50" rx="10" fill="#7b5ea7"/>
    <text x="635" y="331" fill="#ffffff" font-weight="bold">Kết quả và ý nghĩa</text>
    <text x="165" y="165" fill="#333333">năm 1885</text>
    <text x="635" y="165" fill="#333333">tên người</text>
    <text x="165" y="285" fill="#333333">sự kiện</text>
    <text x="635" y="285" fill="#333333">ý nghĩa</text>
  </g>
  <line x1="310" y1="180" x2="260" y2="130" stroke="#4a90d9" stroke-width="4"/>
  <line x1="490" y1="180" x2="540" y2="130" stroke="#2e7d32" stroke-width="4"/>
  <line x1="310" y1="220" x2="260" y2="300" stroke="#e67e22" stroke-width="4"/>
  <line x1="490" y1="220" x2="540" y2="300" stroke="#7b5ea7" stroke-width="4"/>
  <line x1="260" y1="105" x2="540" y2="105" stroke="#333333" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="400" y="95" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#333333">đường nối ngang</text>
  <text x="400" y="410" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#666666">Hình minh họa được vẽ riêng cho website (SVG) — mỗi nhánh chỉ ghi từ khóa ngắn.</text>
</svg>

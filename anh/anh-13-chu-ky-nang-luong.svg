<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-label="Sơ đồ đường cong mức tỉnh táo trong ngày, khung buổi tối từ 19 giờ 30 đến 21 giờ 30 được tô đậm là lúc xếp việc khó">
  <rect width="640" height="340" fill="#f7f5ef"/>
  <text x="320" y="34" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f2937">Mức tỉnh táo trong ngày — học sinh kiểu tối</text>
  <line x1="60" y1="280" x2="600" y2="280" stroke="#374151" stroke-width="2"/>
  <line x1="60" y1="280" x2="60" y2="60" stroke="#374151" stroke-width="2"/>
  <text x="320" y="308" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151">Giờ trong ngày</text>
  <text x="26" y="170" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#374151" transform="rotate(-90 26 170)">Mức tỉnh táo</text>
  <rect x="420" y="60" width="130" height="220" fill="#fde68a" opacity="0.55"/>
  <text x="485" y="76" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#92400e">KHUNG ĐỈNH</text>
  <text x="485" y="94" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#92400e">19:30 – 21:30</text>
  <polyline points="70,250 130,240 190,180 250,150 310,140 370,150 430,110 490,95 550,110 590,140" fill="none" stroke="#2563eb" stroke-width="3"/>
  <circle cx="190" cy="180" r="5" fill="#2563eb"/><circle cx="490" cy="95" r="6" fill="#dc2626"/>
  <text x="190" y="205" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151">9:00 – 11:00</text>
  <text x="190" y="220" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151">tỉnh táo vừa</text>
  <text x="490" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626">Đỉnh: xếp việc khó</text>
  <text x="310" y="165" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151">13:00 – 14:30: khung thấp</text>
  <text x="310" y="180" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151">chỉ làm việc nhẹ</text>
  <text x="70" y="268" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151">5h</text>
  <text x="250" y="268" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151">11h</text>
  <text x="430" y="268" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151">17h</text>
  <text x="590" y="268" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151">23h</text>
  <text x="320" y="330" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280">Hình minh họa tự vẽ — không phải dữ liệu đo được</text>
</svg>

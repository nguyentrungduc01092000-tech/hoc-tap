<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Sơ đồ năm bước SQ3R: khảo sát, đặt câu hỏi, đọc, nhắc lại, ôn lại">
  <rect width="800" height="450" fill="#fdf6ec"/>
  <text x="400" y="48" font-family="sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#333333">SQ3R — 5 bước đọc sách giáo khoa</text>
  <g font-family="sans-serif" font-size="18" text-anchor="middle">
    <rect x="40" y="120" width="130" height="110" rx="12" fill="#4a90d9"/>
    <text x="105" y="165" fill="#ffffff" font-weight="bold">S. Khảo sát</text>
    <text x="105" y="195" fill="#ffffff">Xem bản đồ</text>
    <text x="105" y="215" fill="#ffffff">chương</text>
    <text x="190" y="180" font-size="24" fill="#333333">→</text>
    <rect x="215" y="120" width="130" height="110" rx="12" fill="#d64545"/>
    <text x="280" y="165" fill="#ffffff" font-weight="bold">Q. Đặt câu hỏi</text>
    <text x="280" y="195" fill="#ffffff">Biến tiêu đề</text>
    <text x="280" y="215" fill="#ffffff">thành câu hỏi</text>
    <text x="365" y="180" font-size="24" fill="#333333">→</text>
    <rect x="390" y="120" width="130" height="110" rx="12" fill="#e67e22"/>
    <text x="455" y="165" fill="#ffffff" font-weight="bold">R1. Đọc</text>
    <text x="455" y="195" fill="#ffffff">Đọc để trả lời</text>
    <text x="455" y="215" fill="#ffffff">câu hỏi</text>
    <text x="540" y="180" font-size="24" fill="#333333">→</text>
    <rect x="565" y="120" width="130" height="110" rx="12" fill="#2e7d32"/>
    <text x="630" y="165" fill="#ffffff" font-weight="bold">R2. Nhắc lại</text>
    <text x="630" y="195" fill="#ffffff">Gấp sách,</text>
    <text x="630" y="215" fill="#ffffff">trả lời từ nhớ</text>
  </g>
  <g font-family="sans-serif" font-size="18" text-anchor="middle">
    <rect x="320" y="280" width="160" height="90" rx="12" fill="#6a1b9a"/>
    <text x="400" y="318" fill="#ffffff" font-weight="bold">R3. Ôn lại</text>
    <text x="400" y="346" fill="#ffffff">Nối các ý với nhau</text>
  </g>
  <text x="400" y="410" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#666666">Hình minh họa tự vẽ (SVG) — làm theo từng mục, không đọc một mạch cả chương.</text>
</svg>

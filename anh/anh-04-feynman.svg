<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Sơ đồ bốn bước phương pháp Feynman theo Đại học Colorado: chọn khái niệm, dạy lại, lấp chỗ trống, đơn giản hóa">
  <rect width="800" height="450" fill="#fdf6ec"/>
  <text x="400" y="48" font-family="sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#333333">Phương pháp Feynman — 4 bước (Colorado)</text>
  <g font-family="sans-serif" font-size="18" text-anchor="middle">
    <rect x="60" y="120" width="160" height="130" rx="12" fill="#4a90d9"/>
    <text x="140" y="165" fill="#ffffff" font-weight="bold">1. Chọn</text>
    <text x="140" y="195" fill="#ffffff">một khái niệm</text>
    <text x="140" y="223" fill="#ffffff">cụ thể</text>
    <text x="240" y="190" font-size="28" fill="#333333">→</text>
    <rect x="275" y="120" width="160" height="130" rx="12" fill="#d64545"/>
    <text x="355" y="165" fill="#ffffff" font-weight="bold">2. Dạy lại</text>
    <text x="355" y="195" fill="#ffffff">bằng lời</text>
    <text x="355" y="223" fill="#ffffff">đơn giản</text>
    <text x="455" y="190" font-size="28" fill="#333333">→</text>
    <rect x="490" y="120" width="160" height="130" rx="12" fill="#e67e22"/>
    <text x="570" y="165" fill="#ffffff" font-weight="bold">3. Lấp chỗ</text>
    <text x="570" y="195" fill="#ffffff">trống vừa</text>
    <text x="570" y="223" fill="#ffffff">lộ ra</text>
  </g>
  <g font-family="sans-serif" font-size="18" text-anchor="middle">
    <rect x="320" y="290" width="160" height="90" rx="12" fill="#2e7d32"/>
    <text x="400" y="328" fill="#ffffff" font-weight="bold">4. Đơn giản hóa</text>
    <text x="400" y="356" fill="#ffffff">(Simplify)</text>
  </g>
  <text x="400" y="420" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#666666">Bốn bước phương pháp Feynman theo Đại học Colorado: chọn khái niệm, dạy lại, lấp chỗ trống, đơn giản hóa.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Sơ đồ lịch ôn lặp lại ngắt quãng: học mới ngày 1, ôn lại ngày 2, ngày 4, ngày 7 và ngày 12, khoảng cách dài dần">
  <rect width="800" height="450" fill="#fdf6ec"/>
  <text x="400" y="48" font-family="sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#333333">Lịch ôn mẫu 14 ngày — khoảng cách dài dần</text>
  <line x1="80" y1="200" x2="720" y2="200" stroke="#333333" stroke-width="3"/>
  <g font-family="sans-serif" font-size="17" text-anchor="middle">
    <circle cx="110" cy="200" r="26" fill="#d64545"/>
    <text x="110" y="206" fill="#ffffff" font-weight="bold">1</text>
    <text x="110" y="260" fill="#333333">Học mới</text>
    <circle cx="250" cy="200" r="26" fill="#4a90d9"/>
    <text x="250" y="206" fill="#ffffff" font-weight="bold">2</text>
    <text x="250" y="260" fill="#333333">Tự kiểm tra</text>
    <circle cx="390" cy="200" r="26" fill="#4a90d9"/>
    <text x="390" y="206" fill="#ffffff" font-weight="bold">4</text>
    <text x="390" y="260" fill="#333333">Ôn phần đã sai</text>
    <circle cx="530" cy="200" r="26" fill="#4a90d9"/>
    <text x="530" y="206" fill="#ffffff" font-weight="bold">7</text>
    <text x="530" y="260" fill="#333333">Kiểm tra nhỏ</text>
    <circle cx="680" cy="200" r="26" fill="#2e7d32"/>
    <text x="680" y="206" fill="#ffffff" font-weight="bold">12</text>
    <text x="680" y="260" fill="#333333">Ôn lần cuối</text>
  </g>
  <text x="400" y="330" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#333333">Mỗi lần ôn lại đều có tự kiểm tra trước khi mở sách.</text>
  <text x="400" y="390" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#666666">Hình minh họa được vẽ riêng cho website (SVG) — lịch mẫu, không phải lịch đã được nghiên cứu chứng minh.</text>
</svg>

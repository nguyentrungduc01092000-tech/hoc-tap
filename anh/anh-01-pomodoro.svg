<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Sơ đồ một cụm Pomodoro: bốn chặng 25 phút làm việc, xen kẽ ba lần nghỉ 5 phút, rồi nghỉ dài 15 đến 30 phút">
  <rect width="800" height="450" fill="#fdf6ec"/>
  <text x="400" y="48" font-family="sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#333333">Một cụm Pomodoro (theo Duke)</text>
  <g font-family="sans-serif" font-size="18" text-anchor="middle">
    <rect x="60" y="110" width="130" height="90" rx="12" fill="#d64545"/>
    <text x="125" y="148" fill="#ffffff" font-weight="bold">25 phút</text>
    <text x="125" y="176" fill="#ffffff">Làm việc</text>
    <rect x="215" y="110" width="80" height="90" rx="12" fill="#4a90d9"/>
    <text x="255" y="148" fill="#ffffff" font-weight="bold">5 phút</text>
    <text x="255" y="176" fill="#ffffff">Nghỉ</text>
    <rect x="320" y="110" width="130" height="90" rx="12" fill="#d64545"/>
    <text x="385" y="148" fill="#ffffff" font-weight="bold">25 phút</text>
    <text x="385" y="176" fill="#ffffff">Làm việc</text>
    <rect x="475" y="110" width="80" height="90" rx="12" fill="#4a90d9"/>
    <text x="515" y="148" fill="#ffffff" font-weight="bold">5 phút</text>
    <text x="515" y="176" fill="#ffffff">Nghỉ</text>
    <rect x="580" y="110" width="130" height="90" rx="12" fill="#d64545"/>
    <text x="645" y="148" fill="#ffffff" font-weight="bold">25 phút</text>
    <text x="645" y="176" fill="#ffffff">Làm việc</text>
  </g>
  <g font-family="sans-serif" font-size="18" text-anchor="middle">
    <rect x="60" y="240" width="80" height="90" rx="12" fill="#4a90d9"/>
    <text x="100" y="278" fill="#ffffff" font-weight="bold">5 phút</text>
    <text x="100" y="306" fill="#ffffff">Nghỉ</text>
    <rect x="165" y="240" width="130" height="90" rx="12" fill="#d64545"/>
    <text x="230" y="278" fill="#ffffff" font-weight="bold">25 phút</text>
    <text x="230" y="306" fill="#ffffff">Làm việc</text>
    <rect x="320" y="240" width="200" height="90" rx="12" fill="#2e7d32"/>
    <text x="420" y="278" fill="#ffffff" font-weight="bold">15–30 phút</text>
    <text x="420" y="306" fill="#ffffff">Nghỉ dài sau 4 chặng</text>
  </g>
  <text x="400" y="390" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#666666">Hình minh họa được vẽ riêng cho website (SVG) — không phải ảnh chụp đồng hồ thật.</text>
</svg>

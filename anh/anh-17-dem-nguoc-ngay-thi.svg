<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Sơ đồ ba giai đoạn ôn tập đếm ngược từ ngày thi: giai đoạn 1 ôn toàn bộ, giai đoạn 2 luyện đề và tự kiểm tra, giai đoạn 3 củng cố phần yếu">
  <rect width="800" height="450" fill="#fdf6ec"/>
  <text x="400" y="48" font-family="sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#333333">Ôn tập đếm ngược từ ngày thi — 3 giai đoạn</text>
  <g font-family="sans-serif" font-size="18" text-anchor="middle">
    <rect x="40" y="120" width="220" height="130" rx="12" fill="#4a90d9"/>
    <text x="150" y="165" fill="#ffffff" font-weight="bold">Giai đoạn 1</text>
    <text x="150" y="195" fill="#ffffff">Ôn toàn bộ,</text>
    <text x="150" y="223" fill="#ffffff">phần yếu trước</text>
    <text x="280" y="190" font-size="28" fill="#333333">→</text>
    <rect x="300" y="120" width="220" height="130" rx="12" fill="#d64545"/>
    <text x="410" y="165" fill="#ffffff" font-weight="bold">Giai đoạn 2</text>
    <text x="410" y="195" fill="#ffffff">Luyện đề,</text>
    <text x="410" y="223" fill="#ffffff">tự kiểm tra</text>
    <text x="540" y="190" font-size="28" fill="#333333">→</text>
    <rect x="560" y="120" width="200" height="130" rx="12" fill="#2e7d32"/>
    <text x="660" y="165" fill="#ffffff" font-weight="bold">Giai đoạn 3</text>
    <text x="660" y="195" fill="#ffffff">Củng cố</text>
    <text x="660" y="223" fill="#ffffff">phần yếu</text>
  </g>
  <text x="400" y="310" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#333333">Ngày thi là mốc — mọi việc tính lùi từ ngày thi.</text>
  <text x="400" y="345" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#333333">Kế hoạch vỡ thì dời việc sang buổi trống, không bỏ cả kế hoạch.</text>
  <text x="400" y="420" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#666666">Hình minh họa được vẽ riêng cho website (SVG) — ba giai đoạn là gợi ý thực hành, không phải lịch đã được nghiên cứu chứng minh.</text>
</svg>

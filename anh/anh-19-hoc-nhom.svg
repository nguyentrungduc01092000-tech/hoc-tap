<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="Sơ đồ ba học sinh học nhóm: mỗi người chuẩn bị một phần, giải thích cho nhau và ghi chỗ còn vướng vào sổ chung.">
  <rect width="640" height="360" fill="#f4f1ea"/>
  <text x="320" y="36" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2f4858">Học nhóm: mỗi người chuẩn bị một phần</text>
  <g font-family="sans-serif" font-size="15" fill="#2f4858">
    <rect x="40" y="70" width="160" height="90" rx="10" fill="#cfe3d8" stroke="#2f4858"/>
    <text x="120" y="100" text-anchor="middle" font-weight="bold">Lan</text>
    <text x="120" y="126" text-anchor="middle">Chuẩn bị: khái niệm</text>
    <text x="120" y="148" text-anchor="middle">cân bằng</text>
    <rect x="240" y="70" width="160" height="90" rx="10" fill="#f6d9a0" stroke="#2f4858"/>
    <text x="320" y="100" text-anchor="middle" font-weight="bold">Minh</text>
    <text x="320" y="126" text-anchor="middle">Chuẩn bị: yếu tố</text>
    <text x="320" y="148" text-anchor="middle">ảnh hưởng</text>
    <rect x="440" y="70" width="160" height="90" rx="10" fill="#c9d6ef" stroke="#2f4858"/>
    <text x="520" y="100" text-anchor="middle" font-weight="bold">Huy</text>
    <text x="520" y="126" text-anchor="middle">Chuẩn bị: bài tập</text>
    <text x="520" y="148" text-anchor="middle">tính toán</text>
  </g>
  <g stroke="#2f4858" stroke-width="2" fill="none">
    <line x1="120" y1="160" x2="200" y2="205"/>
    <line x1="320" y1="160" x2="320" y2="205"/>
    <line x1="520" y1="160" x2="440" y2="205"/>
  </g>
  <rect x="170" y="205" width="300" height="60" rx="10" fill="#ffffff" stroke="#2f4858"/>
  <text x="320" y="232" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f4858">Giải thích cho nhau, đặt câu hỏi</text>
  <text x="320" y="254" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2f4858">Cùng làm bài tập, so đáp án</text>
  <rect x="170" y="285" width="300" height="50" rx="10" fill="#e8e2d4" stroke="#2f4858"/>
  <text x="320" y="306" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2f4858">Sổ chung: ghi chỗ còn vướng</text>
  <text x="320" y="328" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#5a6b7a">Ba người học nhóm: mỗi người chuẩn bị một phần rồi giải thích cho nhau, kèm sổ chung.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Sơ đồ trang ghi chép Cornell: cột gợi ý hẹp bên trái khoảng 6 cm, cột ghi chép rộng bên phải, phần tóm tắt cao khoảng 5 cm ở cuối trang">
  <rect width="800" height="450" fill="#fdf6ec"/>
  <text x="400" y="48" font-family="sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#333333">Trang ghi chép Cornell</text>
  <g font-family="sans-serif" font-size="18" text-anchor="middle">
    <rect x="180" y="80" width="150" height="220" fill="#ffffff" stroke="#333333" stroke-width="2"/>
    <text x="255" y="120" fill="#333333" font-weight="bold">Cột gợi ý</text>
    <text x="255" y="150" fill="#333333">khoảng 6 cm</text>
    <text x="255" y="180" fill="#333333">Câu hỏi, từ khóa</text>
    <text x="255" y="210" fill="#333333">(sau buổi học)</text>
    <rect x="330" y="80" width="290" height="220" fill="#e8f0fe" stroke="#333333" stroke-width="2"/>
    <text x="475" y="120" fill="#333333" font-weight="bold">Cột ghi chép</text>
    <text x="475" y="150" fill="#333333">Phần rộng nhất</text>
    <text x="475" y="180" fill="#333333">Ý chính, định nghĩa,</text>
    <text x="475" y="210" fill="#333333">công thức, ví dụ</text>
    <rect x="180" y="300" width="440" height="70" fill="#fff3cd" stroke="#333333" stroke-width="2"/>
    <text x="400" y="330" fill="#333333" font-weight="bold">Phần tóm tắt — cao khoảng 5 cm</text>
    <text x="400" y="356" fill="#333333">Viết lại bằng lời của mình</text>
  </g>
  <text x="400" y="410" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#666666">Sơ đồ trang ghi chép Cornell: cột gợi ý khoảng 6 cm, cột ghi chép rộng, phần tóm tắt cao khoảng 5 cm.</text>
</svg>
